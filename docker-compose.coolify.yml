services:
  gosip:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
    volumes:
      - gosip-data:/app/data
    environment:
      GOSIP_DATA_DIR: /app/data
      GOSIP_HTTP_PORT: "8080"
      GOSIP_SIP_PORT: "5060"
      GOSIP_CORS_ORIGINS: ${GOSIP_CORS_ORIGINS}
      TZ: ${TZ:-America/New_York}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gosip-data:
    external: true
    name: ${GOSIP_VOLUME_NAME}
